{% load static %}
<!DOCTYPE html>
<html lang="en" class="no-js">
<!-- Mirrored from lmpixels.com/demo/leven-html-new/light/index.html by HTTrack Website Copier/3.x [XR&CO'2014], Thu, 30 Apr 2026 08:58:26 GMT -->
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge"> 
    <title>{% block title %}{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Leven - Resume / CV / vCard Template" />
    <meta name="keywords" content="vcard, resposnive, retina, resume, jquery, css3, bootstrap, portfolio" />
    <meta name="author" content="lmpixels" />
    <link rel="shortcut icon" href="favicon.ico">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/normalize.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'css/owl.carousel.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'css/magnific-popup.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'css/main.css' %}" type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="{% static 'js/modernizr.custom.js' %}"></script>
  </head>

  <body class="page">
    <div class="lm-animated-bg"></div>
    
    <!-- Loading animation -->
    <div class="preloader">
      <div class="preloader-animation">
        <div class="preloader-spinner">
        </div>
      </div>
    </div>
    <!-- /Loading animation -->

    <!-- Scroll To Top Button -->
    <div class="lmpixels-scroll-to-top"><i class="bi bi-arrow-up"></i></div>
    <!-- /Scroll To Top Button -->

    <div class="page-scroll">
      <div id="page_container" class="page-container bg-move-effect" data-animation="transition-flip-in-right">

        <!-- Header -->
        <header id="site_header" class="header">
          <div class="header-content clearfix d-flex justify-content-between align-items-center">
                
            <!-- Text Logo -->
            <div class="text-logo">
              <a href="/">
                <div class="logo-symbol">M</div>
                <div class="logo-text">ilan <span>Bhasima</span></div>
              </a>
            </div>
            <!-- /Text Logo -->

            <!-- Navigation -->
            <div class="site-nav mobile-menu-hide">
              <ul class="leven-classic-menu site-main-menu">
                <li class="menu-item">
                  <a href="/">About Me</a>
                </li>

                <li class="menu-item">
                  <a href="/resume">Resume</a>
                </li>

                <li class="menu-item">
                  <a href="/portfolio">Portfolio</a>
                </li>
                
                <li class="menu-item">
                  <a href="/blog">Blog</a>
                </li>

                <li class="menu-item">
                  <a href="/contact">Contact</a>
                </li>
              </ul>
            </div>
            
            <div class="form-check form-switch ms-3 d-flex align-items-center">
              <input class="form-check-input" type="checkbox" id="themeSwitch">
              <label class="form-check-label ms-2" for="themeSwitch">🌙</label>
            </div>

            <!-- Mobile Menu Toggle -->
            <a class="menu-toggle mobile-visible">
              <i class="fa fa-bars"></i>
            </a>
            <!-- Mobile Menu Toggle -->
          </div>
        </header>
        <!-- /Header -->

        {% block content %}
        {% endblock %}


        <!-- Footer -->
        <footer class="site-footer clearfix">
          <div class="footer-social">
            <ul class="footer-social-links">
              <li>
                <a href="#" target="_blank">Twitter</a>
              </li>

              <li>
                <a href="https://www.facebook.com/milan.bhasima/" target="_blank">Facebook</a>
              </li>

              <li>
                <a href="#" target="_blank">Instagram</a>
              </li>
            </ul>
          </div>
              
          <div class="footer-copyrights">
            <p>© 2026 Milan Bhasima All rights reserved.</p>
          </div>
        </footer>
        <!-- /Footer -->
        
      </div>
    </div>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
          const themeSwitch = document.getElementById('themeSwitch');

          // Load saved theme
          const savedTheme = localStorage.getItem('theme') || 'light';

          document.documentElement.setAttribute('data-bs-theme', savedTheme);

          if (savedTheme === 'dark') {
              themeSwitch.checked = true;
          }

          themeSwitch.addEventListener('change', function () {
              const theme = this.checked ? 'dark' : 'light';

              document.documentElement.setAttribute('data-bs-theme', theme);
              localStorage.setItem('theme', theme);
          });
      });
      </script>
    <script src="{% static 'js/jquery-2.1.3.min.js' %}"></script>
    <script src="{% static 'js/imagesloaded.pkgd.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
    <script src="{% static 'js/jquery.shuffle.min.js' %}"></script>
    <script src="{% static 'js/masonry.pkgd.min.js' %}"></script>
    <script src="{% static 'js/owl.carousel.min.js' %}"></script>
    <script src="{% static 'js/jquery.magnific-popup.min.js' %}"></script>
    <script src="{% static 'js/jquery.googlemap.js' %}"></script>
    <script src="{% static 'js/validator.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>

<!-- Mirrored from lmpixels.com/demo/leven-html-new/light/index.html by HTTrack Website Copier/3.x [XR&CO'2014], Thu, 30 Apr 2026 08:58:47 GMT -->
</html>
